name: Build iOS App

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build and Pack IPA
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Build Archive
        run: |
          xcodebuild -project Unity-iPhone.xcodeproj -scheme Unity-iPhone -configuration Release -archivePath build/Unity-iPhone.xcarchive archive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      - name: Create Payload and IPA
        run: |
          mkdir -p build/Payload
          cp -r build/Unity-iPhone.xcarchive/Products/Applications/*.app build/Payload/
          cd build && zip -r Unity-iPhone.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/Unity-iPhone.ipa
